# Arma NOX para Windows, Mac y Android y lo publica como versión de GitHub.
# Corre solo cuando cambia el archivo VERSION, o a mano desde la pestaña Actions.
name: Versiones de NOX
on:
  push:
    branches: [main]
    paths: [VERSION, desktop/**, android/**, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  ELECTRON: "31.7.7"
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - name: Armar NOX para Windows
        run: |
          V=$(cat VERSION)
          curl -sSL -o e.zip "https://github.com/electron/electron/releases/download/v$ELECTRON/electron-v$ELECTRON-win32-x64.zip"
          curl -sSL -o rcedit.exe "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          mkdir NOX && cd NOX && unzip -q ../e.zip && mv electron.exe NOX.exe && rm -f resources/default_app.asar && cd ..
          scripts/app.sh NOX/resources/app
          cp desktop/config.json NOX/config.json
          cp desktop/LEEME-windows.txt NOX/LEEME.txt
          ./rcedit.exe NOX/NOX.exe --set-icon desktop/icon.ico --set-version-string ProductName NOX --set-version-string FileDescription "NOX - Crónicas del Paraguay" --set-version-string CompanyName "The BnKr Media" --set-file-version "$V" --set-product-version "$V"
          7z a -tzip -mx=9 NOX-Windows.zip NOX > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: NOX-Windows.zip }
  mac:
    # Se arma en Linux (los equipos Mac de GitHub no estaban disponibles) y se firma "ad hoc" con rcodesign.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, label: AppleSilicon }
          - { arch: x64, label: Intel }
    steps:
      - uses: actions/checkout@v4
      - name: Armar NOX.app
        run: |
          V=$(cat VERSION)
          curl -sSL -o e.zip "https://github.com/electron/electron/releases/download/v$ELECTRON/electron-v$ELECTRON-darwin-${{ matrix.arch }}.zip"
          mkdir out && cd out && unzip -q ../e.zip && cd .. && mv out/Electron.app NOX.app
          R=NOX.app/Contents/Resources
          rm -f $R/default_app.asar
          scripts/app.sh $R/app
          python3 - "$V" <<'PY'
          import plistlib,sys,shutil
          v=sys.argv[1];p='NOX.app/Contents/Info.plist'
          d=plistlib.load(open(p,'rb'))
          d['NSMicrophoneUsageDescription']='NOX usa el micrófono para el chat de voz del grupo.'
          d.update(CFBundleName='NOX',CFBundleDisplayName='NOX',CFBundleIdentifier='com.thebnkrmedia.nox',CFBundleShortVersionString=v,CFBundleVersion=v)
          plistlib.dump(d,open(p,'wb'))
          shutil.copy('desktop/icon.icns','NOX.app/Contents/Resources/electron.icns')
          PY
          curl -sSL -o rc.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf rc.tgz && RC=$(find . -name rcodesign -type f | head -1) && chmod +x "$RC"
          "$RC" sign NOX.app
          zip -qry -9 NOX-Mac-${{ matrix.label }}.zip NOX.app
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.label }}
          path: NOX-Mac-*.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Armar NOX.apk
        run: |
          cd android && gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../NOX.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: NOX.apk }
  publicar:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publicar la versión
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(cat VERSION)
          ls -la dist
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" dist/* --title "NOX $V" --latest --notes "NOX $V para Windows, Mac y Android. Con internet, el juego se actualiza solo. Instrucciones: https://noxparaguay.com/#descargar"
      - name: Avisar a las apps que hay versión nueva
        run: |
          V=$(cat VERSION)
          printf '{\n  "version": "%s",\n  "apk": "https://github.com/GeorgeElHumano/nox/releases/download/v%s/NOX.apk"\n}\n' "$V" "$V" > public/version.json
          git config user.name "NOX"
          git config user.email "noreply@noxparaguay.com"
          git add public/version.json
          git diff --cached --quiet || (git commit -m "Versión $V publicada para las apps" && git push)
